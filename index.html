<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacman Browser Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-shell">
      <canvas id="gameCanvas" width="600" height="650"></canvas>
      <div class="touch-controls" aria-label="Touch controls">
        <button type="button" class="control-button up" data-direction="UP" aria-label="Move up">&#9650;</button>
        <button type="button" class="control-button left" data-direction="LEFT" aria-label="Move left">&#9664;</button>
        <button type="button" class="control-button down" data-direction="DOWN" aria-label="Move down">&#9660;</button>
        <button type="button" class="control-button right" data-direction="RIGHT" aria-label="Move right">&#9654;</button>
      </div>
      <button type="button" id="restartButton" class="restart-button">Restart</button>
      <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
